<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121a25"/>
      <stop offset="1" stop-color="#080b10"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7fd13a"/>
      <stop offset="1" stop-color="#b6fa64"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b6fa64" stop-opacity=".30"/>
      <stop offset="1" stop-color="#b6fa64" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b6fa64" stop-opacity=".55"/>
      <stop offset="1" stop-color="#b6fa64" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect x="6" y="6" width="1012" height="1012" rx="222" fill="none" stroke="#202936" stroke-width="12"/>

  <!-- grid -->
  <g stroke="#202936" stroke-width="6" stroke-linecap="round" opacity=".9">
    <line x1="170" y1="320" x2="854" y2="320"/>
    <line x1="170" y1="512" x2="854" y2="512"/>
    <line x1="170" y1="704" x2="854" y2="704"/>
  </g>

  <!-- area under chart -->
  <path d="M190 740 L370 560 L500 650 L690 400 L800 300 L800 800 L190 800 Z" fill="url(#area)"/>

  <!-- glow at the tip -->
  <circle cx="800" cy="300" r="170" fill="url(#glow)"/>

  <!-- chart line -->
  <path d="M190 740 L370 560 L500 650 L690 400 L790 310" fill="none" stroke="url(#line)" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- arrow head (pilot / direction) -->
  <path d="M700 270 L830 270 L830 400" fill="none" stroke="#b6fa64" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- node dots -->
  <circle cx="370" cy="560" r="30" fill="#080b10" stroke="#b6fa64" stroke-width="16"/>
  <circle cx="500" cy="650" r="30" fill="#080b10" stroke="#b6fa64" stroke-width="16"/>
  <circle cx="690" cy="400" r="30" fill="#080b10" stroke="#b6fa64" stroke-width="16"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
